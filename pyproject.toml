[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-nn"
version = "0.1.0"
description = "A minimal neural network library built with NumPy"
requires-python = ">=3.10"
dependencies = [
    "numpy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
    "ipykernel"
]

[tool.setuptools.packages.find]
where = ["src"]